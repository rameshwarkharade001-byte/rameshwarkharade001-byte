<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="100%">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="920" height="270" rx="18" fill="url(#mBg)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="460" y="34" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3" text-anchor="middle">ENGINEERING &amp; CYBER DEFENSE ARCHITECTURE</text>

  <!-- Node 1: Cyber Security -->
  <g transform="translate(125, 130)" filter="url(#mGlow)">
    <polygon points="0,-42 62,-14 0,14 -62,-14" fill="#ef4444" opacity="0.9"/>
    <polygon points="-62,-14 0,14 0,68 -62,40" fill="#991b1b" opacity="0.9"/>
    <polygon points="0,14 62,-14 62,40 0,68" fill="#b91c1c" opacity="0.9"/>
    <text x="0" y="-10" fill="#fff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CYBER SEC</text>
    <text x="0" y="92" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">VAPT • APK Audit</text>
  </g>

  <!-- Node 2: Systems & OS -->
  <g transform="translate(348, 130)" filter="url(#mGlow)">
    <polygon points="0,-42 62,-14 0,14 -62,-14" fill="#8b5cf6" opacity="0.9"/>
    <polygon points="-62,-14 0,14 0,68 -62,40" fill="#5b21b6" opacity="0.9"/>
    <polygon points="0,14 62,-14 62,40 0,68" fill="#6d28d9" opacity="0.9"/>
    <text x="0" y="-10" fill="#fff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">KERNEL/DB</text>
    <text x="0" y="92" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AetherOS • AetherDB</text>
  </g>

  <!-- Node 3: Edge AI & Load -->
  <g transform="translate(572, 130)" filter="url(#mGlow)">
    <polygon points="0,-42 62,-14 0,14 -62,-14" fill="#0ea5e9" opacity="0.9"/>
    <polygon points="-62,-14 0,14 0,68 -62,40" fill="#0369a1" opacity="0.9"/>
    <polygon points="0,14 62,-14 62,40 0,68" fill="#0284c7" opacity="0.9"/>
    <text x="0" y="-10" fill="#fff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">EDGE AI</text>
    <text x="0" y="92" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Sentinel HUD • K6</text>
  </g>

  <!-- Node 4: Live Apps -->
  <g transform="translate(795, 130)" filter="url(#mGlow)">
    <polygon points="0,-42 62,-14 0,14 -62,-14" fill="#10b981" opacity="0.9"/>
    <polygon points="-62,-14 0,14 0,68 -62,40" fill="#047857" opacity="0.9"/>
    <polygon points="0,14 62,-14 62,40 0,68" fill="#059669" opacity="0.9"/>
    <text x="0" y="-10" fill="#fff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PROD APPS</text>
    <text x="0" y="92" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">KidsTone • RK Tech</text>
  </g>

  <!-- Connecting Neon Lasers -->
  <line x1="195" y1="130" x2="278" y2="130" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="418" y1="130" x2="502" y2="130" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="642" y1="130" x2="725" y2="130" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
