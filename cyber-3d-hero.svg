<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#070d1f"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="hyperGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Cyber Chassis -->
  <rect width="920" height="330" rx="22" fill="url(#bgSpace)" stroke="#1e293b" stroke-width="2"/>
  <circle cx="175" cy="165" r="150" fill="url(#coreGlow)"/>

  <!-- 3D Perspective Cyber Floor -->
  <g stroke="#0ea5e9" stroke-width="0.7" opacity="0.2">
    <line x1="0" y1="245" x2="920" y2="245"/>
    <line x1="0" y1="278" x2="920" y2="278"/>
    <line x1="0" y1="312" x2="920" y2="312"/>
    <line x1="180" y1="220" x2="30" y2="330"/>
    <line x1="360" y1="220" x2="290" y2="330"/>
    <line x1="560" y1="220" x2="630" y2="330"/>
    <line x1="740" y1="220" x2="890" y2="330"/>
  </g>

  <!-- Live Rotating 3D Holographic Gyroscope -->
  <g transform="translate(175, 165)" filter="url(#hyperGlow)">
    <ellipse cx="0" cy="0" rx="92" ry="34" fill="none" stroke="#00f5d4" stroke-width="2" stroke-dasharray="18,8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="92" ry="34" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="14,10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="68" ry="68" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 3D Core Diamond -->
    <polygon points="0,-32 28,0 0,32 -28,0" fill="#00f5d4" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-32 28,0 0,0" fill="#ffffff" opacity="0.5"/>
    <text x="0" y="54" fill="#00f5d4" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle">CORE // 0x01</text>
  </g>

  <!-- Right 3D Glass HUD Command Center -->
  <g transform="translate(320, 38)">
    <rect width="562" height="254" rx="16" fill="#090f1e" fill-opacity="0.9" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Animated Top Neon Border Beam -->
    <rect x="20" y="0" width="180" height="2.5" fill="#00f5d4" filter="url(#hyperGlow)">
      <animate attributeName="x" values="20;360;20" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD Header -->
    <circle cx="22" cy="22" r="5" fill="#f43f5e"/>
    <circle cx="38" cy="22" r="5" fill="#eab308"/>
    <circle cx="54" cy="22" r="5" fill="#10b981"/>
    <text x="538" y="26" fill="#00f5d4" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">[ LIVE ENCRYPTED SESSION ]</text>
    <line x1="0" y1="38" x2="562" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Name & Rank -->
    <text x="24" y="68" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold" letter-spacing="2">CYBER SECURITY ARCHITECT • KERNEL &amp; SYSTEMS ENGINEER</text>
    <text x="24" y="106" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900" letter-spacing="1">RAMESHWAR KHARADE</text>
    <text x="24" y="134" fill="#94a3b8" font-family="monospace" font-size="12.5">Founder @ RK Tech Solutions  |  Bare-Metal C++20 • APK Reverse Eng • Edge AI</text>

    <!-- 3D Neon Domain Badges -->
    <rect x="24" y="154" width="162" height="30" rx="7" fill="#f43f5e" fill-opacity="0.16" stroke="#f43f5e" stroke-opacity="0.6"/>
    <text x="105" y="173" fill="#fda4af" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">🛡️ OFFENSIVE VAPT</text>

    <rect x="198" y="154" width="168" height="30" rx="7" fill="#8b5cf6" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="282" y="173" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">⚙️ x86 KERNEL / DB</text>

    <rect x="378" y="154" width="160" height="30" rx="7" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="458" y="173" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">🚀 EDGE &amp; APKS</text>

    <!-- Live Terminal Execution Line -->
    <rect x="24" y="200" width="514" height="34" rx="8" fill="#020617" stroke="#1e293b"/>
    <text x="38" y="221" fill="#00f5d4" font-family="monospace" font-size="12" font-weight="bold">&gt;_ ./deploy --target=global --mode=zero-trust --status=ONLINE</text>
  </g>

  <!-- Full-Width Sweeping Cyber Laser Scanner -->
  <rect x="20" y="10" width="880" height="2" fill="url(#laserBeam)" filter="url(#hyperGlow)">
    <animate attributeName="y" values="12;316;12" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
